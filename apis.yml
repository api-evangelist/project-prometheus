aid: project-prometheus
name: Project Prometheus
description: 'Prometheus (announced in November 2025 as Project Prometheus) is a San
  Francisco based artificial intelligence company co-founded by Jeff Bezos and Vik
  Bajaj, who serve as co-CEOs. The company builds what it calls an "artificial general
  engineer" — physical-AI models intended to automate the design, simulation and manufacture
  of complex physical systems across computing, aerospace, automotive production and
  drug development, learning from real-world trial and error rather than from text
  corpora alone. It launched with roughly $6.2B in funding and raised a ~$12B Series
  B in June 2026 at a reported $41B valuation, backed by Bezos, ARCH Venture Partners,
  JPMorgan Chase, Goldman Sachs and BlackRock, with offices in San Francisco, London
  and Zurich. As of August 2026 the company remains in stealth: prometheus.ai is served
  entirely behind a Vercel bot challenge, and no public developer portal, documentation,
  API, first-party GitHub organization, package or machine-readable contract could
  be located.'
